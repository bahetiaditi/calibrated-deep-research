# calibrated-deep-research — central configuration
#
# RULE: no magic numbers in src/. If a value could reasonably be changed,
# it lives here. Ablations and baselines work by overriding this file
# (see benchmark/run_ablations.py), which is only possible if nothing is
# hardcoded. Treat a literal in a node as a bug.

run:
  seed: 20260805
  trace_dir: traces
  results_dir: results
  checkpoint_db: data/checkpoints.sqlite   # LangGraph SqliteSaver (C19)

# ---------------------------------------------------------------------------
# LLM providers  (C2; revised after probing what is actually CALLABLE)
#
# Two lessons, both learned the hard way and both worth keeping:
#
#  (a) Appearing in AI Studio's rate-limit page does NOT mean callable.
#      gemini-2.5-flash showed 5 RPM / 20 RPD there and returns 404
#      "no longer available to new users". Appearing in models.list() does
#      not mean callable either — 2.5-flash is listed with a 1M context
#      window and still 404s. Only a real generateContent call settles it.
#      scripts/probe_gemini.py is that check; re-run it if models change.
#
#  (b) A 200 response does not mean usable. gemini-3.7-flash and 3.8-flash
#      returned success with EMPTY text, having spent the whole output
#      budget on hidden thinking: they ignore thinking_budget: 0. Any model
#      added here must be verified to return non-empty text, not just 200.
#
# VERIFIED CALLABLE 2026-09-06 (probe + rate-limit page):
#   gemini-3.1-flash-lite   15 RPM | 250K TPM | 500 RPD   text OK
#   gemini-3.5-flash         5 RPM | 250K TPM |  20 RPD   text OK
#   gemini-3.7 / 3.8-flash   5 RPM | 250K TPM |  20 RPD   EMPTY TEXT - unusable
#   gemini-3.6-flash, 3.5-flash-lite                      400 INVALID_ARGUMENT
#   gemini-2.5-flash, 2.5-flash-lite                      404 retired
#   groq openai/gpt-oss-120b  30 RPM | 8K TPM | 1K RPD | 200K TPD
#   groq openai/gpt-oss-20b   30 RPM | 8K TPM | 1K RPD | 200K TPD
#   groq qwen/qwen3.8-27b     30 RPM | 8K TPM | 1K RPD | 200K TPD
#
# NOT verified, possible upside: gemma-4-31b-it / gemma-4-26b-a4b-it show
# 30 RPM | 16K TPM | 14.4K RPD on the rate-limit page — by far the largest
# daily allowance available. Probe before relying on them.
#
# Allocation rationale:
#  - JUDGMENT stays entirely on Groq. The report text must be generated by a
#    different provider than the one that grades it, or the judge scores its
#    own family's output (self-preference bias). A scaffold test enforces
#    this separation.
#  - JUDGE is gemini-3.1-flash-lite for one reason: volume. Scoring the test
#    split plus B0-B3 plus A1-A5 is ~10 result files x 24 questions = ~240
#    judge calls. At 20 RPD (3.5-flash) that is twelve days; at 500 RPD it is
#    one. Flash-Lite is the weaker model, and the mitigation is already in the
#    plan: the 20% manual spot-check at C37 (REFERENCE.md 6.4) validates it.
#  - Version is PINNED, never an alias. gemini-flash-latest would silently
#    change model between the calibration run and the test run, making the
#    two sets of scores incomparable and destroying the held-out split.
# ---------------------------------------------------------------------------
llm:
  default_temperature: 0.0
  quota_ledger_path: data/quota_ledger.json

  retry:
    max_attempts: 3
    initial_backoff_s: 2.0
    backoff_multiplier: 2.0
    retry_on_status: [500, 502, 503, 504]
    # A 429 is never retried on the same model — it switches. This bounds how
    # long we block on a minute-window limit before falling through.
    max_quota_wait_s: 90.0

  roles:
    # Planner, critic, decider, synthesizer. Groq only, and now exclusively so:
    # moving mechanical work off Groq (below) reserves the entire 600K TPD
    # across these three models for the calls where quality actually matters.
    judgment:
      - provider: groq
        model: openai/gpt-oss-120b
        max_output_tokens: 2048
        reasoning_effort: medium
        supports_json_mode: true
        limits: {rpm: 30, rpd: 1000, tpm: 8000, tpd: 200000, reset_timezone: UTC}
      - provider: groq
        model: qwen/qwen3.8-27b
        max_output_tokens: 2048
        reasoning_effort: medium
        supports_json_mode: true
        limits: {rpm: 30, rpd: 1000, tpm: 8000, tpd: 200000, reset_timezone: UTC}
      - provider: groq
        model: openai/gpt-oss-20b
        max_output_tokens: 2048
        reasoning_effort: medium
        supports_json_mode: true
        limits: {rpm: 30, rpd: 1000, tpm: 8000, tpd: 200000, reset_timezone: UTC}

    # Claim segmentation, query reformulation, citation validation — high
    # volume, low judgment. Gemma leads because 14.4K RPD dwarfs everything
    # else on the account, and this is the work that generates the volume.
    #
    # Gemma caveats, all verified by probe:
    #  - NO thinking_budget key. It returns 400 "Thinking budget is not
    #    supported". Thinking cannot be disabled either: a one-word reply
    #    cost 52 tokens, 43 of them hidden reasoning. Hence the raised
    #    max_output_tokens — a 1024 cap would leave little for the answer.
    #  - supports_system_instruction: false. Gemma has no separate system
    #    role on this API; the provider folds it into the prompt.
    #  - supports_json_mode: false until proven otherwise. The structured
    #    layer's local repair handles fenced/damaged output without it.
    #  - TPM is only 16K, so ~5 calls/minute sustained. That, not RPD, is
    #    the real ceiling here.
    mechanical:
      - provider: gemini
        model: gemma-4-31b-it
        max_output_tokens: 2048
        supports_json_mode: false
        supports_system_instruction: false
        limits: {rpm: 30, rpd: 14400, tpm: 16000, reset_timezone: America/Los_Angeles}
      - provider: gemini
        model: gemini-3.1-flash-lite
        max_output_tokens: 1024
        thinking_budget: 0
        supports_json_mode: true
        limits: {rpm: 15, rpd: 500, tpm: 250000, reset_timezone: America/Los_Angeles}
      - provider: groq
        model: openai/gpt-oss-20b
        max_output_tokens: 1024
        reasoning_effort: low
        supports_json_mode: true
        limits: {rpm: 30, rpd: 1000, tpm: 8000, tpd: 200000, reset_timezone: UTC}

    # Evaluation only. Different provider AND family from the judgment chain,
    # so the family that writes a report never grades it.
    # Flash-Lite over Gemma here despite Gemma's larger allowance: entailment
    # judging is the one place in the eval where model quality directly moves
    # the reported numbers, and 500 RPD already covers the ~240 judge calls
    # (10 result files x 24 questions) in a single day. Capacity is not the
    # binding constraint for this role; quality is.
    # No fallback: a judge that silently changes model mid-run makes scores
    # incomparable — better to fail loudly and resume tomorrow.
    judge:
      - provider: gemini
        model: gemini-3.1-flash-lite
        max_output_tokens: 1024
        thinking_budget: 0
        supports_json_mode: true
        limits: {rpm: 15, rpd: 500, tpm: 250000, reset_timezone: America/Los_Angeles}

  cache:
    enabled: true             # MANDATORY during eval — wired in C3
    dir: data/cache/llm
    # Key = sha256(model + system + user + temperature + max_output_tokens).
    # Disable only when deliberately re-running a judge blind (C37 scoring).

# ---------------------------------------------------------------------------
# Budget (D4). One "run" = one benchmark question end to end.
# ---------------------------------------------------------------------------
budget:
  llm_calls_max: 25
  retrieval_calls_max: 20
  wall_clock_max_s: 900
  reserve_fraction: 0.20      # held back for critic + decider; D4 may not spend it
  min_calls_per_subquestion: 1
  max_rounds_per_subquestion: 3
  max_plan_revisions: 2

# ---------------------------------------------------------------------------
# Retrieval / RAG layer
# ---------------------------------------------------------------------------
retrieval:
  dense:
    model: BAAI/bge-small-en-v1.5
    dim: 384
    # REQUIRED by the model card. Omitting it silently degrades recall.
    query_prefix: "Represent this sentence for searching relevant passages: "
    batch_size: 32
  sparse:
    backend: bm25s
    stemmer: english
  fusion:
    method: rrf
    k: 60                     # Cormack et al. 2009; parameter-free in practice
    candidates_per_retriever: 50
  rerank:
    model: BAAI/bge-reranker-base
    input_candidates: 30
    output_top_k: 8
    batch_size: 16
  store:
    backend: qdrant
    path: data/qdrant
    collection: evidence
    distance: cosine
  contradiction:
    model: cross-encoder/nli-deberta-v3-small
    max_pairs_per_subquestion: 15   # top-6 passages => 15 pairs, caps CPU cost
    contradiction_threshold: 0.60
    # Two chunks of the SAME paper appearing to contradict each other is
    # usually an artefact — a hypothesis stated before it is refuted, a
    # limitation acknowledged after a result. That is not sources
    # disagreeing, and counting it would inflate f5 on a corpus that agrees.
    cross_source_only: true
    # NLI heads are asymmetric in practice even where the relation is
    # symmetric in principle. Score both directions and take the stronger
    # signal: missing a real contradiction costs more than the forward pass.
    symmetric: true

chunking:
  web:
    size_chars: 800
    overlap_chars: 150
    sentence_boundary_aware: true
  paper:
    strategy: section_aware
    size_chars: 1000
    overlap_chars: 150
    never_cross_section_boundary: true
    canonical_sections:
      - Abstract
      - Introduction
      - Background
      - Related Work
      - Method
      - Methods
      - Approach
      - Experiments
      - Experimental Setup
      - Results
      - Analysis
      - Discussion
      - Ablation
      - Limitations
      - Conclusion
      - References
    header_regex: '^\s*(\d+(?:\.\d+)*)\s+([A-Z][A-Za-z \-]{2,60})\s*$'

sources:
  arxiv:
    delay_seconds: 3.0        # arXiv API etiquette — do not lower
    num_retries: 3
    max_results_default: 8
    pdf_cache_dir: data/cache/pdf
  web:
    # Preferred provider first; the other follows as fallback. A provider
    # without credentials is skipped, not an error — someone without a
    # Tavily account can still run the system on ddgs.
    provider: tavily          # tavily | ddgs — ddgs is dev-only, rate-limits hard
    max_results_default: 6
    tavily_search_depth: basic   # "advanced" costs 2 credits; budget is 1000/mo
    # Tavily credits are the one hard external budget in retrieval. The full
    # eval needs ~250; careless development could spend 1000 in an afternoon.
    # The daily cap turns that failure into a fallback to ddgs rather than a
    # dead key two weeks before the eval run.
    tavily_credits_per_month: 1000
    tavily_credits_per_day: 33
    credit_ledger_path: data/search_credits.json

# ---------------------------------------------------------------------------
# Sufficiency scoring and the abstention decision (§5)
# ---------------------------------------------------------------------------
sufficiency:
  model_path: results/sufficiency_model.joblib
  calibration:
    method: isotonic          # applied only if the reliability diagram warrants
    apply: auto               # auto | always | never
  thresholds:
    # Placeholders. Overwritten by analysis/calibrate.py at C33 using the
    # CALIBRATION split only. Never hand-tune these against test results.
    tau_answer: 0.65
    tau_partial: 0.40
    target_risk: 0.10         # target error rate among answered questions
  hard_rules:
    abstain_on_failed_premise: true       # categorical, bypasses tau
    premise_grounding_min: 0.35

# ---------------------------------------------------------------------------
# Evaluation
# ---------------------------------------------------------------------------
evaluation:
  benchmark_path: benchmark/questions.json
  retrieval_labels_path: benchmark/retrieval_labels.json
  splits: [calibration, test]
  judge:
    model: gemini-2.5-flash
    temperature: 0.0
    cache_enabled: false      # judge runs blind — no cache reuse from the agent
  spot_check_fraction: 0.20
  bootstrap_iterations: 1000  # CIs — n=24 per split, report them honestly

# ---------------------------------------------------------------------------
# Agency switches. Each flag freezes exactly one decision surface.
# Default = everything live. Ablations flip exactly one to false.
# ---------------------------------------------------------------------------
agency:
  d1_plan_revision: true
  d2_adaptive_route_and_query: true
  d3_adaptive_depth_and_stopping: true
  d4_budget_allocation: true
  d5_terminal_decision: true
  critic_five_way_routing: true

  # Static counterparts used when the corresponding flag is false.
  static:
    route_rule: arxiv_meta            # A2: fixed route for every sub-question
    query_verbatim: true              # A2: query = sub-question text
    fixed_top_k: 8                    # A3: one round, fixed k, always stop
    uniform_budget_split: true        # A4
    critic_binary: true               # A5: re-retrieve or accept